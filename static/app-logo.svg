<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CopySpeak logo">
  <defs>
    <linearGradient id="cs-mint" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8FEDC6"/>
      <stop offset="0.55" stop-color="#5BD8A6"/>
      <stop offset="1" stop-color="#3EC48F"/>
    </linearGradient>
  </defs>

  <!-- rounded-square frame -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none"
        stroke="url(#cs-mint)" stroke-width="46"/>

  <!-- speaker: back plate + horn, one path fattened by an equal stroke for rounded corners -->
  <path d="M150 208 h48 l76 -66 v228 l-76 -66 h-48 z"
        fill="url(#cs-mint)" stroke="url(#cs-mint)" stroke-width="26"
        stroke-linejoin="round"/>

  <!-- sound waves -->
  <path d="M318 196 a76 76 0 0 1 0 120"
        fill="none" stroke="url(#cs-mint)" stroke-width="34" stroke-linecap="round"/>
  <path d="M368 158 a132 132 0 0 1 0 196"
        fill="none" stroke="url(#cs-mint)" stroke-width="34" stroke-linecap="round"/>
</svg>
