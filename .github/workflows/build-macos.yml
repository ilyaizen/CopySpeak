name: Build macOS Installer (Intel)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (auto-detected from package.json if empty)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-13]
        include:
          - platform: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "Using custom tag: ${{ github.event.inputs.tag }}"
          else
            version="${{ steps.version.outputs.version }}"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "Using auto-detected tag: v$version"
          fi

      - name: Extract changelog for current version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(awk -v hdr="## [$version]" '
            /^## \[/ {
              if (found) exit
              if (index($0, hdr) == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF_CHANGELOG"
            echo "$notes"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted release notes for version $version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "CopySpeak ${{ steps.tag.outputs.tag }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: "--target ${{ matrix.target }}"
