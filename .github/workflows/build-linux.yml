name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (auto-detected from package.json if empty)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libunwind-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            patchelf \
            file

      - name: Get version from package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

      - name: Set release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "Using custom tag: ${{ github.event.inputs.tag }}"
          else
            version="${{ steps.version.outputs.version }}"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "Using auto-detected tag: v$version"
          fi

      - name: Extract changelog for current version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build browser companion zip
        run: |
          cd browser-extension
          bun run build
          cd ..
          zip -r "CopySpeak-Companion-${{ steps.version.outputs.version }}.zip" browser-extension/dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "CopySpeak ${{ steps.tag.outputs.tag }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: "--target ${{ matrix.target }}"

      # ── AppImage post-process (fixes #45) ────────────────────────────────────
      # linuxdeploy's AppRun.wrapped C runtime setenv's four poisoned vars at
      # exec time (PYTHONHOME, PYTHONPATH, GST_PLUGIN_SYSTEM_PATH,
      # GST_PLUGIN_SYSTEM_PATH_1_0). A bash `unset` in AppRun CANNOT undo them
      # (the exports happen when AppRun.wrapped execs, after AppRun's unset).
      # Fix A: same-length byte patches inside AppRun.wrapped
      #        (PYTHONHOME→_YTHONHOME etc.) so the exports become no-ops.
      # Fix B: quarantine the bundled gst CORE libs (bundled 1.20 core +
      #        system 1.28 plugins = ABI mismatch both ways); with the env var
      #        gone WebKitGTK falls through to the system gstreamer stack
      #        (plugins-good + libav, installed above).
      # Then repack, re-sign (updater needs a valid signature) and clobber
      # the draft-release assets.
      - name: Patch and repack AppImage
        id: appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE_DIR"/*.AppImage | head -1)
          BASE=$(basename "$APPIMAGE" .AppImage)
          echo "Patching $APPIMAGE"

          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 "$APPIMAGE" --appimage-extract > /dev/null

          # Fix A: same-length byte patches in AppRun.wrapped (order matters:
          # patch the _1_0 variant before the bare GST var).
          python3 - <<'PYEOF'
          data = bytearray(open("squashfs-root/AppRun.wrapped", "rb").read())
          def patch_all(buf, old, new):
              assert len(old) == len(new), "patch must be same-length"
              n = 0
              idx = 0
              while True:
                  i = buf.find(old, idx)
                  if i < 0:
                      return n
                  buf[i:i+len(old)] = new
                  n += 1
                  idx = i + len(old)
          counts = [
              patch_all(data, b"GST_PLUGIN_SYSTEM_PATH_1_0", b"XST_PLUGIN_SYSTEM_PATH_1_0"),
              patch_all(data, b"GST_PLUGIN_SYSTEM_PATH", b"XST_PLUGIN_SYSTEM_PATH"),
              patch_all(data, b"PYTHONHOME", b"_YTHONHOME"),
              patch_all(data, b"PYTHONPATH", b"_YTHONPATH"),
          ]
          assert counts == [1, 1, 1, 2], f"unexpected patch counts: {counts}"
          open("squashfs-root/AppRun.wrapped", "wb").write(bytes(data))
          PYEOF

          # Belt-and-braces: also unset the four vars in the bash AppRun.
          # (NOT sufficient alone — AppRun.wrapped re-exports at exec time —
          # but makes the intent explicit and covers future runtime changes.)
          sed -i '/^exec /i unset PYTHONHOME PYTHONPATH GST_PLUGIN_SYSTEM_PATH GST_PLUGIN_SYSTEM_PATH_1_0' squashfs-root/AppRun
          # (The gtk hook does NOT export GST_PLUGIN_SYSTEM_PATH — the poisoned
          # exports live solely in AppRun.wrapped's C runtime.)

          # Fix B: quarantine bundled gst core libs + glib siblings so WebKit
          # loads the SYSTEM glib/gstreamer (matching system plugins).
          LIBDIR=squashfs-root/usr/lib
          mkdir -p "$LIBDIR/gst-core-quarantine"
          for pattern in libgst* libglib-2.0* libgobject* libgio* libgmodule* \
                         libmount* libpcre2-8* libffi* liblzma* libzstd* \
                         libblkid* libcap.so* liblz4* libselinux* libsystemd* \
                         libgcrypt*; do
            for f in "$LIBDIR"/$pattern; do
              [ -e "$f" ] || continue
              mv "$f" "$LIBDIR/gst-core-quarantine/"
            done
          done
          # The bundled gstreamer plugin dir is empty anyway; drop it.
          rm -rf "$LIBDIR/gstreamer-1.0"

          # Repack. appimagetool on ubuntu-22.04 has working FUSE-less run
          # via APPIMAGE_EXTRACT_AND_RUN; NO_STRIP mirrors the build args.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage \
            --no-appstream squashfs-root "$APPIMAGE"

          # Re-sign for the updater (tauri-action signed the ORIGINAL bytes;
          # both the .sig file and latest.json must carry the NEW signature).
          # The key IS password-protected: the password secret exists on the
          # repo (see env above). The CLI reads it from TAURI_SIGNING_PRIVATE_
          # KEY_PASSWORD — do NOT delete that env line and do NOT pass "".
          bunx @tauri-apps/cli signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
            "$APPIMAGE"

          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          ls -la "$BUNDLE_DIR"

      # Upload the patched AppImage + new .sig, then refresh the linux-x86_64
      # signature inside latest.json (tauri-action embedded the ORIGINAL
      # signature when it generated the manifest during the build step).
      - name: Upload patched AppImage and refresh updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          APPIMAGE: ${{ steps.appimage.outputs.appimage }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" --output latest.json
          jq --arg sig "$(cat "$APPIMAGE.sig")" \
            '.platforms["linux-x86_64"].signature = $sig' \
            latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$APPIMAGE" "$APPIMAGE.sig" latest.json

      - name: Attach browser companion zip to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          files: CopySpeak-Companion-*.zip
