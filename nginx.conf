server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: cache for a year. Missing files return 404, not the SPA shell.
    location ^~ /_app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static files (landing media, sounds, icons). Missing files return 404, not the SPA shell.
    location ~* \.(?:js|css|mp3|mp4|webp|png|jpg|svg|ico|woff2|json|txt|xml)$ {
        try_files $uri =404;
    }

    # Prerendered routes (/settings -> settings.html), then the SPA fallback.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
